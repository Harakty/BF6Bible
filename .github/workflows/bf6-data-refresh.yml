name: Refresh BF6 data and deploy

on:
  workflow_dispatch:
  schedule:
    - cron: '13 */6 * * *'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/bf6-data-refresh.yml'
      - 'index.html'
      - 'package-lock.json'
      - 'package.json'
      - 'scripts/**'
      - 'src/**'
      - 'tsconfig.json'
      - 'vite.config.ts'

permissions:
  contents: write

concurrency:
  group: bf6-data-refresh
  cancel-in-progress: false

jobs:
  refresh-build-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Refresh generated data
        run: npm run refresh:data

      - name: Build site
        run: npm run build

      - name: Commit refreshed datasets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git diff --quiet -- src/generated; then
            echo "No generated data changes."
          else
            git add src/generated
            git commit -m "Refresh generated BF6 data [skip ci]"
            git push origin HEAD:main
          fi

      - name: Deploy to gh-pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin gh-pages --depth=1

          rm -rf ../bf6bible-gh-pages
          git worktree add ../bf6bible-gh-pages origin/gh-pages
          find ../bf6bible-gh-pages -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -R dist/. ../bf6bible-gh-pages/

          cd ../bf6bible-gh-pages
          git add -A
          if git diff --cached --quiet; then
            echo "No deploy changes."
          else
            git commit -m "Deploy BF6 Bible"
            git push origin HEAD:gh-pages
          fi
