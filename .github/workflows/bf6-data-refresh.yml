name: Refresh BF6 data and deploy

on:
  workflow_dispatch:
  schedule:
    - cron: '13 */6 * * *'
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/bf6-data-refresh.yml'
      - 'index.html'
      - 'package-lock.json'
      - 'package.json'
      - 'scripts/**'
      - 'src/**'
      - 'tsconfig.json'
      - 'vite.config.ts'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/bf6-data-refresh.yml'
      - 'index.html'
      - 'package-lock.json'
      - 'package.json'
      - 'scripts/**'
      - 'src/**'
      - 'tsconfig.json'
      - 'vite.config.ts'

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: bf6-data-refresh
  cancel-in-progress: false

jobs:
  refresh-build-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Refresh generated data
        if: github.event_name != 'pull_request'
        run: npm run refresh:data

      # Data refresh can legitimately move ranking snapshots.
      # Regenerate them first, then run tests for invariants that must still hold.
      # The later git diff decides whether those ranking shifts need human review.
      - name: Update ranking snapshots after data refresh
        if: github.event_name != 'pull_request'
        run: npm run test:update

      - name: Check tests
        run: npm run test

      - name: Detect ranking snapshot shifts
        if: github.event_name != 'pull_request'
        id: snapshot-shifts
        shell: bash
        run: |
          if git diff --quiet -- src/__tests__/__snapshots__; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            node scripts/reportRankingShifts.mjs > ranking-shifts.md
          fi

      - name: Report ranking shifts
        if: github.event_name != 'pull_request' && steps.snapshot-shifts.outputs.changed == 'true'
        shell: bash
        run: |
          echo "Ranking snapshots changed; committing refreshed data and deploying."
          cat ranking-shifts.md
          {
            echo "### Ranking shifts detected"
            echo
            cat ranking-shifts.md
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Commit refreshed datasets
        if: github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add src/generated src/__tests__/__snapshots__
          if git diff --cached --quiet; then
            echo "No generated data changes."
          else
            git commit -m "Refresh generated BF6 data [skip ci]"
            git push origin HEAD:main
          fi

      - name: Build site
        run: npm run build

      - name: Deploy to gh-pages
        if: github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin gh-pages --depth=1

          rm -rf ../bf6bible-gh-pages
          git worktree add ../bf6bible-gh-pages origin/gh-pages
          find ../bf6bible-gh-pages -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -R dist/. ../bf6bible-gh-pages/

          cd ../bf6bible-gh-pages
          git add -A
          if git diff --cached --quiet; then
            echo "No deploy changes."
          else
            git commit -m "Deploy BF6 Bible"
            git push origin HEAD:gh-pages
          fi
